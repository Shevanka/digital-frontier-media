[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-frontier-production"
version = "0.1.0"
description = "AI-assisted bilingual editorial production system for The Digital Frontier"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
digital-frontier = "production_engine.cli:main"

[tool.setuptools.packages.find]
include = ["production_engine*"]
